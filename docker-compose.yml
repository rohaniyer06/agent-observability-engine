services:
  postgres:
    image: postgres:16-alpine
    container_name: aoe-postgres
    environment:
      POSTGRES_USER: aoe
      POSTGRES_PASSWORD: aoe
      POSTGRES_DB: aoe
    ports:
      - "55432:5432"
    volumes:
      - aoe-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoe -d aoe"]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      # Tuned a little for the load test: the default 100 connections is fine,
      # but the default shared_buffers (128MB) makes the span-insert path
      # disk-bound sooner than it needs to be on a laptop run.
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "synchronous_commit=off"

  redis:
    image: redis:7-alpine
    container_name: aoe-redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      # maxmemory-policy noeviction is deliberate: this is a durability buffer.
      # If we hit the ceiling we want XADD to fail loudly (and ingestion to shed
      # load with 503) rather than silently evict un-acked telemetry.
      - "redis-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "no"

volumes:
  aoe-pgdata:
